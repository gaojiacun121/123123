<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纵向性状全转录组关联分析精细定位计算平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", system-ui, sans-serif;
    }
    html,body {
      height: 100%;
      color: #2c3e50;
    }
    .home-banner {
      background: linear-gradient(135deg, #e1edf8 0%, #c8e0f5 100%);
      height: 100%;
      width:100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:24px;
      position: relative;
      overflow: hidden;
    }
    .home-banner::before{
      content:"";
      position:absolute;
      width:400px;
      height:400px;
      border-radius:50%;
      background:rgba(255,255,255,0.25);
      top:-120px;
      left:-100px;
      z-index:0;
    }
    .home-banner::after{
      content:"";
      position:absolute;
      width:300px;
      height:300px;
      border-radius:50%;
      background:rgba(255,255,255,0.2);
      bottom:-80px;
      right:-60px;
      z-index:0;
    }
    .container{
      position: relative;
      z-index: 1;
      width:100%;
      max-width:1100px;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .home-content{
      background:rgba(255,255,255,0.65);
      backdrop-filter: blur(8px);
      padding:34px 44px;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(41, 128, 185, 0.12);
      text-align:center;
      animation: fadeIn 0.8s ease-out;
      margin-bottom:22px;
    }
    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }
    .home-content h1 {
      font-size: 30px;
      margin-bottom:16px;
      color:#154366;
      line-height:1.4;
    }
    .home-desc {
      font-size:17px;
      color:#2c4d68;
      margin-bottom:24px;
      line-height:1.6;
    }
    .btn-group{
      display:flex;
      gap:16px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .btn-enter-platform {
      display:inline-block;
      padding:13px 40px;
      background:#2980b9;
      color:#ffffff;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
      transition: all 0.25s ease;
      box-shadow:0 4px 12px rgba(41,128,185,0.25);
    }
    .btn-enter-platform:hover{
      background:#1f6d99;
      transform: translateY(-2px);
      box-shadow:0 6px 16px rgba(41,128,185,0.3);
    }
    .btn-enter-platform:active{
      transform: translateY(1px);
      box-shadow:0 2px 8px rgba(41,128,185,0.2);
    }
    .btn-intro{
      display:inline-block;
      padding:13px 40px;
      background:#ffffff;
      color:#2980b9;
      border:2px solid #2980b9;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
      transition: all 0.25s ease;
    }
    .btn-intro:hover{
      background:#2980b9;
      color:#fff;
      transform: translateY(-2px);
    }
    .section-title{
      text-align:center;
      font-size:21px;
      color:#154366;
      margin-bottom:14px;
    }
    .func-grid{
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap:14px;
    }
    .func-card{
      background:rgba(255,255,255,0.70);
      backdrop-filter: blur(6px);
      border-radius:12px;
      box-shadow:0 3px 12px rgba(41,128,185,0.08);
      border:1px solid rgba(255,255,255,0.4);
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px 10px;
      transition:0.28s ease;
    }
    .func-card:hover{
      transform: translateY(-3px);
      box-shadow:0 6px 14px rgba(41,128,185,0.14);
    }
    .func-card h3{
      font-size:16px;
      color:#154366;
      text-align:center;
    }
    @media(max-width:992px){
      .func-grid{
        grid-template-columns: repeat(2,1fr);
      }
    }
    @media(max-width:768px){
      .home-banner{
        padding:16px;
      }
      .home-content{
        padding:24px 18px;
        margin-bottom:16px;
      }
      .home-content h1{
        font-size:22px;
      }
      .section-title{
        font-size:18px;
        margin-bottom:12px;
      }
      .func-grid{
        grid-template-columns:1fr;
        gap:12px;
      }
    }
  </style>
</head>
<body>
<section class="home-banner">
  <div class="container">
    <div class="home-content">
      <h1>纵向性状全转录组关联分析精细定位计算平台</h1>
      <div class="home-desc">
        集成表型、基因型、RNA‑seq预处理、表达量预测、GWAS、TWAS全套分析流程。
      </div>
      <div class="btn-group">
        <button class="btn-enter-platform" onclick="location.href='analysis.html'">
          进入平台分析
        </button>
        <button class="btn-intro" onclick="location.href='intro.html'">
          平台介绍
        </button>
      </div>
    </div>
    <h2 class="section-title">平台功能模块</h2>
    <div class="func-grid">
      <div class="func-card" onclick="location.href='analysis.html?module=phe'">
        <h3>📊 表型数据处理</h3>
      </div>
      <div class="func-card" onclick="location.href='analysis.html?module=geno'">
        <h3>🧬 基因型数据处理</h3>
      </div>
      <div class="func-card" onclick="location.href='analysis.html?module=rna'">
        <h3>📜 RNAseq数据处理</h3>
      </div>
      <div class="func-card" onclick="location.href='analysis.html?module=pred'">
        <h3>🔮 表达量预测</h3>
      </div>
      <div class="func-card" onclick="location.href='analysis.html?module=gwas'">
        <h3>📈 GWAS分析</h3>
      </div>
      <div class="func-card" onclick="location.href='analysis.html?module=twas'">
        <h3>🧪 TWAS分析</h3>
      </div>
    </div>
  </div>
</section>
</body>
</html>
