<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>基因型数据上传 | 纵向性状全转录组关联分析精细定位计算平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", system-ui, sans-serif;
    }
    .nav-bar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:999;
      background:rgba(255,255,255,0.7);
      backdrop-filter: blur(6px);
      padding:12px 20px;
      display:flex;
      justify-content:center;
      gap:12px;
    }
    .nav-btn{
      padding:8px 22px;
      border:none;
      border-radius:8px;
      font-size:15px;
      cursor:pointer;
      background:#2980b9;
      color:#ffffff;
      transition:0.24s ease;
    }
    .nav-btn.active{
      background:#ffffff;
      color:#222222;
      box-shadow:0 2px 6px rgba(0,0,0,0.12);
    }
    .nav-btn:hover:not(.active){
      background:#1f6d99;
    }

    body {
      background-color: #f5f7fa;
      padding:70px 20px 40px;
      color: #2c3e50;
    }
    .container {
      max-width:900px;
      margin: 0 auto;
    }
    .back-link{
      margin-bottom:24px;
    }
    .back-link a{
      color:#2980b9;
      text-decoration:none;
    }
    .back-link a:hover{
      text-decoration:underline;
    }
    h2 {
      text-align: center;
      margin-bottom: 28px;
      font-size:24px;
      color:#154366;
    }
    .card-box{
      background:#ffffff;
      border-radius:12px;
      padding:28px;
      box-shadow:0 2px 12px rgba(41,128,185,0.08);
    }
    .form-row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:18px;
      margin-bottom:18px;
    }
    .form-item{
      display:flex;
      flex-direction:column;
    }
    label{
      font-size:14px;
      margin-bottom:6px;
    }
    label .red{
      color:#dc3545;
    }
    input,select,textarea{
      padding:8px 10px;
      border:1px solid #d2d9e0;
      border-radius:6px;
      font-size:14px;
    }
    textarea{
      min-height:120px;
      resize:vertical;
    }
    .upload-area{
      border:2px dashed #d2d9e0;
      border-radius:8px;
      padding:32px 16px;
      text-align:center;
      margin:8px 0 18px;
    }
    .upload-area .tip{
      font-size:13px;
      color:#666;
      margin-top:8px;
    }
    .btn-normal{
      padding:9px 24px;
      border:none;
      border-radius:6px;
      background:#2980b9;
      color:#fff;
      cursor:pointer;
      font-size:14px;
    }
    .btn-normal:hover{
      background:#1f6d99;
    }
    .bottom-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:24px;
    }
    .check-wrap{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:14px;
    }
    @media(max-width:768px){
      .nav-bar{
        gap:6px;
      }
      .nav-btn{
        padding:7px 12px;
        font-size:14px;
      }
      .form-row{
        grid-template-columns:1fr;
      }
      .card-box{
        padding:20px 16px;
      }
      .bottom-bar{
        flex-direction:column;
        gap:14px;
        align-items:flex-start;
      }
    }
  </style>
</head>
<body>
<div class="nav-bar">
  <button class="nav-btn" data-target="intro" onclick="location.href='intro.html'">平台介绍</button>
  <button class="nav-btn" data-target="analysis" onclick="location.href='analysis.html'">数据上传</button>
  <button class="nav-btn" data-target="result" onclick="location.href='result.html'">结果展示</button>
</div>

<div class="container">
  <div class="back-link">
    <a href="analysis.html">← 返回分析功能页面</a>
  </div>
  <h2>基因型数据完整上传</h2>
  <div class="card-box">
    <form>
      <div class="form-row">
        <div class="form-item">
          <label>数据名称 <span class="red">*</span></label>
          <input type="text" placeholder="请输入数据名称" required>
        </div>
        <div class="form-item">
          <label>芯片类型 <span class="red">*</span></label>
          <select required>
            <option value="">请选择</option>
            <option>Illumina PorcineSNP60</option>
            <option>Affymetrix Axiom Porcine</option>
            <option>定制芯片</option>
            <option>全基因组测序</option>
            <option>其他</option>
          </select>
        </div>
        <div class="form-item">
          <label>数据来源 <span class="red">*</span></label>
          <input type="text" placeholder="请输入数据来源" required>
        </div>
        <div class="form-item">
          <label>样本数量 <span class="red">*</span></label>
          <input type="number" placeholder="请输入样本数量" required>
        </div>
      </div>
      <div class="form-item" style="margin-bottom:18px;">
        <label>检测时间 <span class="red">*</span></label>
        <input type="date" required>
      </div>
      <div class="form-item" style="margin-bottom:18px;">
        <label>数据描述 <span class="red">*</span></label>
        <textarea placeholder="请详细描述数据的检测方法、处理过程、包含的SNP数量等信息" required></textarea>
      </div>
      <div class="form-item">
        <label>数据文件 <span class="red">*</span></label>
        <div class="upload-area">
          <p>点击或拖拽文件到此处上传</p>
          <p class="tip">支持 PLINK、VCF、HAPMAP 格式，单个文件不超过 500MB</p>
          <input type="file" multiple accept=".bed,.bim,.fam,.vcf,.vcf.gz,.hapmap" style="margin-top:12px;" required>
        </div>
      </div>
      <div class="bottom-bar">
        <div class="check-wrap">
          <input type="checkbox" required id="agreeGeno">
          <label for="agreeGeno">我已阅读并同意数据上传协议</label>
        </div>
        <button class="btn-normal" type="submit">提交上传</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const path = window.location.pathname;
  const btns = document.querySelectorAll(".nav-btn");
  btns.forEach(b=>{
    const t = b.dataset.target;
    if(t==="intro" && path.includes("intro.html")) b.classList.add("active");
    if(t==="analysis" && path.includes("analysis.html")) b.classList.add("active");
    if(t==="result" && path.includes("result.html")) b.classList.add("active");
  })
})()
</script>
</body>
</html>
