<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>表型数据上传 | 纵向性状全转录组关联分析精细定位计算平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", system-ui, sans-serif;
    }
    html, body {
      min-height: 100vh;
      color: #e0f2fe;
    }
    .page-wrap {
      position: relative;
      min-height: 100vh;
      width: 100%;
      padding-top: 70px;
      padding-bottom: 40px;
      overflow: auto;
      background:
        radial-gradient(circle at 22% 16%, rgba(72, 178, 230, 0.4), transparent 32%),
        radial-gradient(circle at 78% 84%, rgba(41, 128, 185, 0.35), transparent 36%),
        linear-gradient(140deg, #092342 0%, #103666 45%, #1a4b88 100%);
      z-index: 0;
    }
    /* 网格底纹 */
    .grid-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(80, 180, 240, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80, 180, 240, 0.07) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 45%, transparent 75%);
    }
    /* 弥散粒子 */
    .soft-particles {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 22%, rgba(130, 210, 255, 0.7) 1px, transparent 2px),
        radial-gradient(circle at 86% 30%, rgba(130, 210, 255, 0.6) 1px, transparent 2px),
        radial-gradient(circle at 34% 76%, rgba(130, 210, 255, 0.55) 1px, transparent 2px),
        radial-gradient(circle at 70% 82%, rgba(130, 210, 255, 0.65) 1px, transparent 2px);
      background-size: 240px 240px, 280px 280px, 300px 300px, 260px 260px;
      opacity: 0.45;
    }
    /* 横向扫描线 */
    .scan-line-h {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #48b2e6, transparent);
      z-index: 0;
      pointer-events: none;
      animation: scanH 7s ease-in-out infinite;
    }
    .scan-line-h.s1 { top: 26%; }
    .scan-line-h.s2 { top: 64%; animation-delay: 3.5s; }
    @keyframes scanH {
      0% { transform: translateX(-40%); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateX(40%); opacity: 0; }
    }
    /* 四角HUD短角标 */
    .hud-corner-mark {
      position: absolute;
      width: 72px;
      height: 72px;
      pointer-events: none;
      z-index: 1;
      border-color: rgba(72, 178, 230, 0.4);
      border-style: solid;
      border-width: 0;
    }
    .hud-corner-mark.tl { top: 80px; left: 16px; border-top-width:2px; border-left-width:2px; }
    .hud-corner-mark.tr { top: 80px; right:16px; border-top-width:2px; border-right-width:2px; }
    .hud-corner-mark.bl { bottom:40px; left:16px; border-bottom-width:2px; border-left-width:2px; }
    .hud-corner-mark.br { bottom:40px; right:16px; border-bottom-width:2px; border-right-width:2px; }
    /* 导航栏 */
    .nav-bar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:999;
      background:rgba(226, 242, 255, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding:12px 20px;
      display:flex;
      justify-content:center;
      gap:20px;
      border-bottom:1px solid rgba(125, 211, 252, 0.25);
    }
    .nav-btn{
      display:inline-flex;
      align-items:center;
      text-decoration:none;
      padding:10px 28px;
      border:none;
      border-radius:12px;
      font-size:17px;
      cursor:pointer;
      background:#2980b9;
      color:#ffffff;
      transition:0.24s ease;
    }
    .nav-btn:hover:not(.active){
      background:#1f6d99;
    }
    .nav-btn.active{
      background:#ffffff;
      color:#222222;
      box-shadow:0 2px 6px rgba(0,0,0,0.12);
    }
    /* 主体容器 —— 铺满页面，取消最大宽度限制 */
    .container {
      position:relative;
      z-index:3;
      max-width:100%;
      margin: 0 auto;
      padding:0 48px;
    }
    .back-link{
      margin-bottom:28px;
    }
    .back-link a{
      color:#7dd3fc;
      text-decoration:none;
      font-size:19px;
    }
    .back-link a:hover{
      text-decoration:underline;
    }
    h2 {
      text-align: center;
      margin-bottom: 36px;
      font-size:34px;
      color:#e0f2fe;
      text-shadow:0 0 14px rgba(72,178,230,0.5);
    }
    /* 表单卡片 控制台面板 —— 放大框、放大内边距 */
    .card-box{
      background:linear-gradient(145deg, rgba(12,42,78,0.65), rgba(18,58,104,0.55));
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border:1px solid rgba(72,178,230,0.38);
      border-radius:22px;
      padding:42px 38px;
      box-shadow: 0 0 22px rgba(41,128,185,0.18), inset 0 0 18px rgba(56,189,248,0.08);
      position:relative;
    }
    .card-box::before,
    .card-box::after{
      content:"";
      position:absolute;
      width:32px;
      height:32px;
      border-color:rgba(72,178,230,0.55);
      border-style:solid;
      border-width:0;
    }
    .card-box::before{ top:0; left:0; border-top-width:2px; border-left-width:2px; }
    .card-box::after{ bottom:0; right:0; border-bottom-width:2px; border-right-width:2px; }
    .form-row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:24px;
      margin-bottom:24px;
    }
    .form-item{
      display:flex;
      flex-direction:column;
    }
    label{
      font-size:18px;
      margin-bottom:10px;
      color:#b9e3f8;
    }
    label .red{
      color:#ff7b8c;
    }
    .time-row{
      display:flex;
      gap:16px;
      align-items:center;
      color:#b9e3f8;
      font-size:17px;
    }
    input[type="text"],
    input[type="number"],
    input[type="date"],
    select,
    textarea{
      padding:14px 16px;
      border:1px solid rgba(72,178,230,0.4);
      border-radius:10px;
      font-size:17px;
      background:rgba(20,52,88,0.45);
      color:#e0f2fe;
    }
    select option{
      background:#0f2e52;
      color:#e0f2fe;
    }
    textarea{
      min-height:160px;
      resize:vertical;
    }
    /* 拖拽上传区域 —— 放大框 */
    .upload-area{
      border:2px dashed rgba(72,178,230,0.42);
      border-radius:14px;
      padding:42px 24px;
      text-align:center;
      margin:12px 0 24px;
      background:rgba(22,60,98,0.3);
      transition:0.3s ease;
    }
    .upload-area:hover{
      border-color:rgba(72,178,230,0.85);
      box-shadow:0 0 20px rgba(72,178,230,0.22);
      background:rgba(26,70,114,0.42);
    }
    .upload-area p{
      color:#b9e3f8;
      font-size:18px;
    }
    .upload-area .tip{
      font-size:16px;
      color:#88b8d8;
      margin-top:12px;
    }
    /* 文件选择按钮蓝色 */
    input[type="file"]{
      color:#e0f2fe;
      font-size:17px;
    }
    input[type="file"]::file-selector-button{
      padding:10px 22px;
      margin-right:14px;
      border:none;
      border-radius:8px;
      background:linear-gradient(135deg, #38bdf8, #2563eb);
      color:#ffffff;
      font-size:16px;
      cursor:pointer;
      transition:0.25s ease;
    }
    input[type="file"]::file-selector-button:hover{
      background:linear-gradient(135deg, #0ea5e9, #1d4ed8);
    }
    .btn-normal{
      padding:14px 36px;
      border:none;
      border-radius:10px;
      background:linear-gradient(135deg,#2980b9,#1f6d99);
      color:#fff;
      cursor:pointer;
      font-size:18px;
      box-shadow:0 0 12px rgba(41,128,185,0.25);
      transition:0.24s ease;
    }
    .btn-normal:hover{
      background:linear-gradient(135deg,#1f6d99,#164e75);
      box-shadow:0 0 18px rgba(41,128,185,0.38);
    }
    .bottom-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:32px;
    }
    .check-wrap{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:17px;
      color:#b9e3f8;
    }
    input[type="checkbox"]{
      accent-color:#48b2e6;
      transform:scale(1.25);
    }

    @media(max-width:992px){
      .hud-corner-mark{display:none;}
      .scan-line-h{display:none;}
      .container{padding:0 32px;}
      .card-box{padding:32px 28px;border-radius:18px;}
      h2{font-size:30px;}
      label{font-size:17px;}
      .time-row{font-size:16px;gap:12px;}
      input[type="text"],input[type="number"],input[type="date"],select,textarea{
        font-size:16px;
        padding:12px 14px;
      }
      .upload-area p{font-size:17px;}
      .upload-area .tip{font-size:15px;}
      .btn-normal{font-size:17px;padding:12px 30px;}
      .check-wrap{font-size:16px;}
    }
    @media(max-width:768px){
      .page-wrap{padding-bottom:20px;padding-top:64px;}
      .nav-bar{gap:8px;padding:10px 12px;}
      .nav-btn{padding:7px 14px;font-size:14px;}
      .form-row{
        grid-template-columns:1fr;
        gap:20px;
      }
      .card-box{
        padding:24px 20px;
      }
      .container{padding:0 18px;}
      .back-link a{font-size:17px;}
      h2{font-size:26px;}
      .upload-area{padding:30px 16px;}
      .bottom-bar{
        flex-direction:column;
        gap:18px;
        align-items:flex-start;
      }
      .soft-particles{opacity:0.25;}
    }
  </style>
</head>
<body>
<div class="page-wrap">
  <div class="grid-bg"></div>
  <div class="soft-particles"></div>
  <div class="scan-line-h s1" aria-hidden="true"></div>
  <div class="scan-line-h s2" aria-hidden="true"></div>
  <div class="hud-corner-mark tl" aria-hidden="true"></div>
  <div class="hud-corner-mark tr" aria-hidden="true"></div>
  <div class="hud-corner-mark bl" aria-hidden="true"></div>
  <div class="hud-corner-mark br" aria-hidden="true"></div>
  <div class="nav-bar">
    <a class="nav-btn" data-target="intro" href="intro.html">平台介绍</a>
    <a class="nav-btn active" data-target="analysis" href="analysis.html">数据上传</a>
    <a class="nav-btn" data-target="result" href="result.html">结果展示</a>
    <a class="nav-btn" data-target="askai" href="ai.html">AI 分析助手</a>
  </div>
  <div class="container">
    <div class="back-link">
      <a href="analysis.html">← 返回分析功能页面</a>
    </div>
    <h2>表型数据完整上传</h2>
    <div class="card-box">
      <form>
        <div class="form-row">
          <div class="form-item">
            <label>数据名称 <span class="red">*</span></label>
            <input type="text" placeholder="请输入数据名称" required>
          </div>
          <div class="form-item">
            <label>数据类型 <span class="red">*</span></label>
            <select required>
              <option value="">请选择</option>
              <option>生长性能</option>
              <option>肉质性状</option>
              <option>繁殖性能</option>
              <option>抗病性能</option>
              <option>其他</option>
            </select>
          </div>
          <div class="form-item">
            <label>数据来源 <span class="red">*</span></label>
            <input type="text" placeholder="请输入数据来源" required>
          </div>
          <div class="form-item">
            <label>样本数量 <span class="red">*</span></label>
            <input type="number" placeholder="请输入样本数量" required>
          </div>
        </div>
        <div class="form-item" style="margin-bottom:24px;">
          <label>采集时间范围 <span class="red">*</span></label>
          <div class="time-row">
            <input type="date" required>
            <span>至</span>
            <input type="date" required>
          </div>
        </div>
        <div class="form-item" style="margin-bottom:24px;">
          <label>数据描述 <span class="red">*</span></label>
          <textarea placeholder="请详细描述数据的采集方法、处理过程、包含的指标等信息" required></textarea>
        </div>
        <div class="form-item">
          <label>数据文件 <span class="red">*</span></label>
          <div class="upload-area">
            <p>点击或拖拽文件到此处上传</p>
            <p class="tip">支持 Excel、CSV、TXT 格式，单个文件不超过 100MB</p>
            <input type="file" accept=".xlsx,.xls,.csv,.txt" style="margin-top:16px;" required>
          </div>
        </div>
        <div class="bottom-bar">
          <div class="check-wrap">
            <input type="checkbox" required id="agreePhe">
            <label for="agreePhe">我已阅读并同意数据上传协议</label>
          </div>
          <button class="btn-normal" type="submit">提交上传</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
(function(){
  const path = window.location.pathname;
  const btns = document.querySelectorAll(".nav-btn");
  btns.forEach(b=>{
    b.classList.remove("active");
    const t = b.dataset.target;
    if(t==="intro" && path.includes("intro.html")) b.classList.add("active");
    if(t==="analysis" && (path.includes("analysis.html") || path.includes("upload-pheno.html") || path.includes("upload-geno.html"))) b.classList.add("active");
    if(t==="askai" && (path.includes("ask-ai.html") || path.includes("ai.html"))) b.classList.add("active");
    if(t==="result" && path.includes("result.html")) b.classList.add("active");
  })
})()
</script>
</body>
</html>
