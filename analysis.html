<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纵向性状全转录组关联分析精细定位计算平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", system-ui, sans-serif;
    }
    html, body {
      height: 100%;
      color: #2c3e50;
    }
    .home-banner {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px 240px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(125, 211, 252, 0.55), transparent 30%),
        radial-gradient(circle at 82% 8%, rgba(96, 165, 250, 0.45), transparent 34%),
        radial-gradient(circle at 75% 88%, rgba(56, 189, 248, 0.5), transparent 36%),
        radial-gradient(circle at 25% 92%, rgba(147, 197, 253, 0.45), transparent 32%),
        linear-gradient(135deg, #0b2a4a 0%, #134074 25%, #1a5a9e 55%, #2f80c6 80%, #58a6e0 100%);
      z-index: 0;
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(125, 211, 252, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 211, 252, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 40%, transparent 75%);
    }

    /* 漂浮粒子动画 */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.9) 1px, transparent 2px),
        radial-gradient(circle at 20% 70%, rgba(186,230,253,0.8) 1px, transparent 2px),
        radial-gradient(circle at 35% 40%, rgba(255,255,255,0.7) 1px, transparent 2px),
        radial-gradient(circle at 50% 85%, rgba(125,211,252,0.9) 1px, transparent 2px),
        radial-gradient(circle at 65% 25%, rgba(147,197,253,0.8) 1px, transparent 2px),
        radial-gradient(circle at 80% 55%, rgba(255,255,255,0.8) 1px, transparent 2px),
        radial-gradient(circle at 90% 15%, rgba(191,219,254,0.9) 1px, transparent 2px),
        radial-gradient(circle at 88% 80%, rgba(125,211,252,0.75) 1px, transparent 2px);
      background-size: 260px 260px, 320px 320px, 280px 280px, 340px 340px, 300px 300px, 270px 270px, 310px 310px, 290px 290px;
      opacity: 0.55;
      animation: floatParticle 25s ease-in-out infinite alternate;
    }
    @keyframes floatParticle{
      0%{transform:translateY(0px) translateX(0px);}
      50%{transform:translateY(-25px) translateX(12px);}
      100%{transform:translateY(8px) translateX(-10px);}
    }

    .scan-light {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 180px;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(125, 211, 252, 0.35), transparent);
    }

    /* 全屏横向扫描光带 */
    .full-scan-strip{
      position:absolute;
      top:0;
      left:-120%;
      width:120%;
      height:3px;
      background:linear-gradient(90deg,transparent,rgba(125,211,252,0.65),transparent);
      z-index:1;
      pointer-events:none;
      animation:fullScan 9s linear infinite;
    }
    @keyframes fullScan{
      0%{left:-120%;top:10%;}
      50%{top:50%;}
      100%{left:120%;top:90%;}
    }

    .dna-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .dna-bg svg {
      position: absolute;
      filter: drop-shadow(0 0 10px rgba(125, 211, 252, 0.75));
    }
    /* DNA旋转动画 */
    .dna-bg .dna-1 {
      top: -80px;
      left: -120px;
      width: 460px;
      height: 460px;
      transform: rotate(-10deg);
      opacity: 0.55;
      animation:dnaRotate1 70s linear infinite;
    }
    .dna-bg .dna-2 {
      top: 140px;
      right: -140px;
      width: 560px;
      height: 560px;
      transform: rotate(14deg);
      opacity: 0.45;
      animation:dnaRotate2 85s linear infinite reverse;
    }
    .dna-bg .dna-3 {
      bottom: -100px;
      left: 18%;
      width: 420px;
      height: 420px;
      transform: rotate(-6deg);
      opacity: 0.4;
      animation:dnaRotate1 75s linear infinite;
    }
    .dna-bg .dna-4 {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 780px;
      height: 780px;
      opacity: 0.18;
      animation:dnaRotate2 100s linear infinite reverse;
    }
    @keyframes dnaRotate1{
      0%{transform:rotate(-10deg);}
      100%{transform:rotate(350deg);}
    }
    @keyframes dnaRotate2{
      0%{transform:rotate(14deg);}
      100%{transform:rotate(-346deg);}
    }

    .molecules {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.35;
    }
    .molecules svg {
      position: absolute;
      color: #bae6fd;
    }
    .molecules .mol-1 { top: 8%; left: 42%; width: 90px; height: 90px; }
    .molecules .mol-2 { top: 60%; left: 8%; width: 110px; height: 110px; }
    .molecules .mol-3 { top: 30%; left: 72%; width: 80px; height: 80px; }
    .molecules .mol-4 { bottom: 12%; left: 40%; width: 100px; height: 100px; }

    .hud-panel {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.18), rgba(59, 130, 246, 0.08));
      box-shadow:
        inset 0 0 24px rgba(56, 189, 248, 0.25),
        0 0 22px rgba(56, 189, 248, 0.18);
      backdrop-filter: blur(4px);
    }
    .hud-panel::before,
    .hud-panel::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid #7dd3fc;
    }
    .hud-panel::before {
      top: -1px;
      left: -1px;
      border-right: none;
      border-bottom: none;
    }
    .hud-panel::after {
      bottom: -1px;
      right: -1px;
      border-left: none;
      border-top: none;
    }
    .hud-1 { top: 10%; left: 4%; width: 150px; height: 150px; }
    .hud-2 { top: 18%; right: 5%; width: 180px; height: 180px; }
    .hud-3 { bottom: 260px; left: 6%; width: 160px; height: 160px; }
    .hud-4 { bottom: 280px; right: 4%; width: 200px; height: 200px; }
    .hud-title {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 12px;
      color: #bae6fd;
      letter-spacing: 1px;
      opacity: 0.85;
    }
    .hud-wave {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      height: 40px;
      overflow:hidden;
    }
    .hud-wave-path{
      animation:waveScroll 6s linear infinite;
    }
    @keyframes waveScroll{
      0%{transform:translateX(0px);}
      100%{transform:translateX(-120px);}
    }
    .hud-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      height: 70%;
      border-radius: 50%;
      border: 1px dashed rgba(125, 211, 252, 0.5);
      animation:circlePulse 4s ease-in-out infinite;
    }
    @keyframes circlePulse{
      0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.4;}
      50%{transform:translate(-50%,-50%) scale(1.12);opacity:0.7;}
    }
    .hud-circle::before {
      content: "";
      position: absolute;
      inset: 14%;
      border-radius: 50%;
      border: 1px solid rgba(125, 211, 252, 0.4);
    }
    .hud-circle::after {
      content: "";
      position: absolute;
      inset: 28%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.45), transparent 70%);
    }

    .container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 20px;
    }
    .home-content {
      background: linear-gradient(135deg, rgba(15, 58, 110, 0.55), rgba(30, 90, 160, 0.45));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 40px 48px;
      border-radius: 24px;
      box-shadow:
        0 18px 48px rgba(2, 12, 35, 0.45),
        inset 0 1px 0 rgba(125, 211, 252, 0.6);
      border: 1px solid rgba(125, 211, 252, 0.4);
      text-align: center;
      animation: fadeIn 0.9s ease-out;
      margin-bottom: 26px;
      position: relative;
    }
    .home-content::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 24px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.9), rgba(59, 130, 246, 0.6), rgba(96, 165, 250, 0.8));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .home-content h1 {
      font-size: 30px;
      margin-bottom: 16px;
      color: #e0f2fe;
      line-height: 1.4;
      text-shadow: 0 0 24px rgba(125, 211, 252, 0.85);
      letter-spacing: 0.5px;
    }
    .home-desc {
      font-size: 17px;
      color: #bae6fd;
      margin-bottom: 28px;
      line-height: 1.6;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-enter-platform {
      display: inline-block;
      padding: 14px 42px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #ffffff;
      border: 1px solid rgba(125, 211, 252, 0.6);
      border-radius: 14px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow:
        0 8px 22px rgba(37, 99, 235, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      letter-spacing: 1px;
    }
    .btn-enter-platform:hover {
      background: linear-gradient(135deg, #0ea5e9, #1d4ed8);
      transform: translateY(-3px);
      box-shadow:
        0 12px 28px rgba(14, 165, 233, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .btn-enter-platform:active {
      transform: translateY(1px);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
    }
    .btn-intro {
      display: inline-block;
      padding: 14px 42px;
      background: rgba(15, 58, 110, 0.45);
      color: #7dd3fc;
      border: 1px solid rgba(125, 211, 252, 0.7);
      border-radius: 14px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      letter-spacing: 1px;
    }
    .btn-intro:hover {
      background: rgba(56, 189, 248, 0.25);
      color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(56, 189, 248, 0.45);
      border-color: #7dd3fc;
    }
    .section-title {
      text-align: center;
      font-size: 21px;
      color: #e0f2fe;
      margin-bottom: 18px;
      text-shadow: 0 0 18px rgba(125, 211, 252, 0.75);
      letter-spacing: 1px;
      position: relative;
    }
    .section-title::before,
    .section-title::after {
      content: "";
      display: inline-block;
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #7dd3fc, transparent);
      vertical-align: middle;
      margin: 0 14px;
    }
    .func-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .func-card {
      background: linear-gradient(135deg, rgba(15, 58, 110, 0.55), rgba(30, 90, 160, 0.45));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      box-shadow:
        0 10px 26px rgba(2, 12, 35, 0.4),
        inset 0 1px 0 rgba(125, 211, 252, 0.5);
      border: 1px solid rgba(125, 211, 252, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
      transition: 0.28s ease;
      position: relative;
      overflow: hidden;
    }
    .func-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.18), transparent);
      transition: left 0.6s ease;
    }
    .func-card:hover::before { left: 100%; }
    .func-card:hover {
      transform: translateY(-4px);
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.7), rgba(37, 99, 235, 0.55));
      box-shadow:
        0 14px 32px rgba(14, 165, 233, 0.55),
        0 0 30px rgba(56,189,248,0.35),
        inset 0 1px 0 rgba(125, 211, 252, 0.8);
      border-color: #7dd3fc;
    }
    .func-card h3 {
      font-size: 16px;
      color: #e0f2fe;
      text-align: center;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(125, 211, 252, 0.6);
      position: relative;
      z-index: 1;
    }
    /* 底部科技元素区 */
    .bottom-tech-zone {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      pointer-events: none;
      height: 240px;
    }
    .bottom-tech-zone::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(14, 165, 233, 0.18) 100%);
      pointer-events: none;
    }
    .circuit-layer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 180px;
      z-index: 1;
    }
    .circuit-layer svg {
      width: 100%;
      height: 100%;
      color: #7dd3fc;
      filter: drop-shadow(0 0 8px rgba(125, 211, 252, 0.7));
    }
    .data-nodes {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 40px;
      z-index: 2;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 6%;
    }
    .data-node {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff, #38bdf8);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
      position: relative;
      animation:nodePulse 3.2s ease-in-out infinite;
    }
    .data-node:nth-child(1){animation-delay:0s;}
    .data-node:nth-child(2){animation-delay:0.4s;}
    .data-node:nth-child(3){animation-delay:0.8s;}
    .data-node:nth-child(4){animation-delay:1.2s;}
    .data-node:nth-child(5){animation-delay:1.6s;}
    .data-node:nth-child(6){animation-delay:2.0s;}
    .data-node:nth-child(7){animation-delay:2.4s;}
    .data-node:nth-child(8){animation-delay:2.8s;}
    @keyframes nodePulse{
      0%,100%{transform:scale(1);box-shadow:0 0 12px rgba(56,189,248,0.9);}
      50%{transform:scale(1.35);box-shadow:0 0 22px rgba(56,189,248,1);}
    }
    .data-node::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -30px;
      transform: translateX(-50%);
      width: 2px;
      height: 30px;
      background: linear-gradient(180deg, rgba(125, 211, 252, 0.8), transparent);
    }
    .data-node:nth-child(1) { height: 16px; width: 16px; }
    .data-node:nth-child(2) { height: 12px; width: 12px; }
    .data-node:nth-child(3) { height: 18px; width: 18px; }
    .data-node:nth-child(4) { height: 12px; width: 12px; }
    .data-node:nth-child(5) { height: 14px; width: 14px; }
    .data-node:nth-child(6) { height: 16px; width: 16px; }
    .data-node:nth-child(7) { height: 12px; width: 12px; }
    .data-node:nth-child(8) { height: 18px; width: 18px; }
    .bottom-instruments {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 160px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 4% 30px;
    }
    .bottom-instruments svg {
      color: #e0f2fe;
      filter: drop-shadow(0 0 12px rgba(125, 211, 252, 0.8));
    }
    .bottom-ins-microscope { width: 110px; height: 110px; }
    .bottom-ins-dna { width: 90px; height: 90px; }
    .bottom-ins-chip { width: 100px; height: 100px; }
    .bottom-ins-pcr { width: 100px; height: 100px; }
    .bottom-ins-beaker { width: 90px; height: 90px; }
    .bottom-hud {
      position: absolute;
      bottom: 180px;
      z-index: 4;
      border: 1px solid rgba(125, 211, 252, 0.4);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.22), rgba(59, 130, 246, 0.1));
      box-shadow: inset 0 0 18px rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(4px);
      padding: 10px 14px;
      color: #bae6fd;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .bottom-hud.left { left: 6%; }
    .bottom-hud.right { right: 6%; }
    .bottom-hud-bar {
      width: 140px;
      height: 6px;
      background: rgba(125, 211, 252, 0.15);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
      position: relative;
    }
    .bottom-hud-bar::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 65%;
      background: linear-gradient(90deg, #38bdf8, #60a5fa);
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      animation:barFlow 4s ease-in-out infinite;
    }
    @keyframes barFlow{
      0%,100%{width:45%;}
      50%{width:80%;}
    }

    @media (max-width: 992px) {
      .func-grid { grid-template-columns: repeat(2, 1fr); }
      .dna-bg .dna-1 { width: 340px; height: 340px; animation:none; }
      .dna-bg .dna-2 { width: 420px; height: 420px; animation:none; }
      .dna-bg .dna-4 { width: 620px; height: 620px; animation:none; }
      .hud-1, .hud-3 { width: 120px; height: 120px; }
      .hud-2, .hud-4 { width: 140px; height: 140px; }
      .bottom-ins-microscope { width: 90px; height: 90px; }
      .bottom-ins-chip { width: 80px; height: 80px; }
      .bottom-ins-pcr { width: 80px; height: 80px; }
      .full-scan-strip{display:none;}
      .particles{animation:none;}
    }
    @media (max-width: 768px) {
      .home-banner { padding: 20px 14px 200px; }
      .home-content { padding: 28px 22px; margin-bottom: 20px; }
      .home-content h1 { font-size: 22px; }
      .section-title { font-size: 18px; margin-bottom: 16px; }
      .section-title::before,
      .section-title::after { width: 18px; margin: 0 8px; }
      .func-grid { grid-template-columns: 1fr; gap: 14px; }
      .dna-bg .dna-1 { width: 260px; height: 260px; }
      .dna-bg .dna-2 { width: 320px; height: 320px; }
      .dna-bg .dna-3 { width: 260px; height: 260px; }
      .dna-bg .dna-4 { width: 460px; height: 460px; }
      .hud-panel { display: none; }
      .molecules { opacity: 0.25; }
      .bottom-tech-zone { height: 200px; }
      .bottom-instruments { padding: 0 2% 20px; }
      .bottom-ins-microscope { width: 72px; height: 72px; }
      .bottom-ins-dna { width: 60px; height: 60px; }
      .bottom-ins-chip { width: 64px; height: 64px; }
      .bottom-ins-pcr { width: 64px; height: 64px; }
      .bottom-ins-beaker { width: 60px; height: 60px; }
      .data-nodes { display: none; }
      .bottom-hud { display: none; }
    }
  </style>
</head>
<body>
  <section class="home-banner">
    <div class="grid-overlay"></div>
    <div class="particles"></div>
    <div class="scan-light"></div>
    <div class="full-scan-strip" aria-hidden="true"></div>
    <div class="dna-bg" aria-hidden="true">
      <svg class="dna-4" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="dnaGradBig" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3" />
          </linearGradient>
        </defs>
        <path d="M40 20 C80 40, 120 40, 160 70 C190 90, 160 120, 120 140 C80 160, 40 140, 40 100 C40 70, 90 60, 130 80"
              stroke="url(#dnaGradBig)" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <path d="M40 40 C80 60, 120 60, 160 90 C190 110, 160 140, 120 160"
              stroke="url(#dnaGradBig)" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <path d="M40 60 C80 80, 120 80, 160 110"
              stroke="url(#dnaGradBig)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" />
      </svg>
      <svg class="dna-1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
