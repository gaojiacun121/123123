<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>平台介绍 | 纵向性状全转录组关联分析精细定位计算平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", system-ui, sans-serif;
    }
    html, body {
      min-height: 100vh;
      color: #e0f2fe;
    }
    /* ===== 全局科技背景 与analysis完全一致 ===== */
    .page-wrap {
      position: relative;
      min-height: 100vh;
      width: 100%;
      padding-top:70px;
      padding-bottom:40px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(125, 211, 252, 0.55), transparent 30%),
        radial-gradient(circle at 82% 8%, rgba(96, 165, 250, 0.45), transparent 34%),
        radial-gradient(circle at 75% 88%, rgba(56, 189, 248, 0.5), transparent 36%),
        radial-gradient(circle at 25% 92%, rgba(147, 197, 253, 0.45), transparent 32%),
        linear-gradient(135deg, #0b2a4a 0%, #134074 25%, #1a5a9e 55%, #2f80c6 80%, #58a6e0 100%);
      z-index: 0;
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(125, 211, 252, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 211, 252, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 40%, transparent 75%);
    }
    .particles {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.9) 1px, transparent 2px),
        radial-gradient(circle at 20% 70%, rgba(186,230,253,0.8) 1px, transparent 2px),
        radial-gradient(circle at 35% 40%, rgba(255,255,255,0.7) 1px, transparent 2px),
        radial-gradient(circle at 50% 85%, rgba(125,211,252,0.9) 1px, transparent 2px),
        radial-gradient(circle at 65% 25%, rgba(147,197,253,0.8) 1px, transparent 2px),
        radial-gradient(circle at 80% 55%, rgba(255,255,255,0.8) 1px, transparent 2px),
        radial-gradient(circle at 90% 15%, rgba(191,219,254,0.9) 1px, transparent 2px),
        radial-gradient(circle at 88% 80%, rgba(125,211,252,0.75) 1px, transparent 2px);
      background-size: 260px 260px, 320px 320px, 280px 280px, 340px 340px, 300px 300px, 270px 270px, 310px 310px, 290px 290px;
      opacity: 0.55;
    }
    /* 横向流动扫描光动画 */
    .scan-flow-light{
      position:absolute;
      top:0;
      left:-120%;
      width:100%;
      height:100%;
      background:linear-gradient(90deg,transparent 0%,rgba(125,211,252,0.08) 50%,transparent 100%);
      z-index:0;
      pointer-events:none;
      animation:scanFlow 12s linear infinite;
    }
    @keyframes scanFlow {
      0%{left:-120%;}
      100%{left:120%;}
    }
    /* 纵向扫描光带 */
    .vertical-scan{
      position:absolute;
      top:-20%;
      left:0;
      width:100%;
      height:20%;
      background:linear-gradient(180deg,transparent,rgba(125,211,252,0.12),transparent);
      z-index:0;
      pointer-events:none;
      animation:verticalScan 10s linear infinite;
    }
    @keyframes verticalScan{
      0%{top:-20%;}
      100%{top:100%;}
    }
    /* 脉冲发光粒子层 */
    .pulse-particles{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
    }
    .pulse-dot{
      position:absolute;
      border-radius:50%;
      background:rgba(125,211,252,0.6);
      animation:pulseAnim 4s ease-in-out infinite;
    }
    @keyframes pulseAnim{
      0%,100%{transform:scale(0.6);opacity:0.2;}
      50%{transform:scale(1.4);opacity:0.6;}
    }
    .dot1{width:14px;height:14px;top:15%;left:15%;animation-delay:0s;}
    .dot2{width:10px;height:10px;top:30%;right:20%;animation-delay:1s;}
    .dot3{width:12px;height:12px;top:65%;left:22%;animation-delay:2s;}
    .dot4{width:16px;height:16px;bottom:25%;right:18%;animation-delay:3s;}
    .scan-light {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 180px;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(125, 211, 252, 0.35), transparent);
    }
    /* 外圈科幻装饰：环形轨道 + 点阵雷达 */
    .outer-ring-scifi{
      position:absolute;
      inset:4%;
      z-index:1;
      pointer-events:none;
      border-radius:50%;
      border:1px dashed rgba(125,211,252,0.25);
      animation:rotateRing 60s linear infinite;
    }
    .outer-ring-scifi::before,
    .outer-ring-scifi::after{
      content:"";
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(125,211,252,0.35);
    }
    .outer-ring-scifi::before{
      inset:8%;
      border-top-color:transparent;
      border-right-color:transparent;
      animation:rotateRing 40s linear infinite reverse;
    }
    .outer-ring-scifi::after{
      inset:16%;
      border-bottom-color:transparent;
      border-left-color:transparent;
      animation:rotateRing 50s linear infinite;
    }
    @keyframes rotateRing{
      0%{transform:rotate(0deg);}
      100%{transform:rotate(360deg);}
    }
    .radar-dot-field{
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;
      background-image:
        radial-gradient(circle at 10% 10%,rgba(125,211,252,0.5) 1px,transparent 2px),
        radial-gradient(circle at 20% 80%,rgba(125,211,252,0.4) 1px,transparent 2px),
        radial-gradient(circle at 80% 15%,rgba(125,211,252,0.45) 1px,transparent 2px),
        radial-gradient(circle at 90% 75%,rgba(125,211,252,0.5) 1px,transparent 2px),
        radial-gradient(circle at 50% 5%,rgba(125,211,252,0.35) 1px,transparent 2px),
        radial-gradient(circle at 50% 95%,rgba(125,211,252,0.35) 1px,transparent 2px);
      background-size:220px 220px,260px 260px,240px 240px,280px 280px,300px 300px,320px 320px;
      opacity:0.5;
    }
    /* 数据流线 */
    .data-flow-lines{
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;
      overflow:hidden;
    }
    .data-flow-lines::before,
    .data-flow-lines::after{
      content:"";
      position:absolute;
      left:-20%;
      width:140%;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(125,211,252,0.5),transparent);
      animation:dataFlow 8s linear infinite;
    }
    .data-flow-lines::before{top:20%;animation-delay:0s;}
    .data-flow-lines::after{top:70%;animation-delay:4s;}
    @keyframes dataFlow{
      0%{transform:translateX(-20%);}
      100%{transform:translateX(20%);}
    }
    /* 四角全息装饰 */
    .corner-holo{
      position:absolute;
      width:120px;
      height:120px;
      z-index:1;
      pointer-events:none;
      border:1px solid rgba(125,211,252,0.35);
      background:
        linear-gradient(135deg,rgba(56,189,248,0.12),transparent 60%),
        radial-gradient(circle at center,rgba(56,189,248,0.18),transparent 70%);
      border-radius:18px;
      box-shadow:inset 0 0 24px rgba(56,189,248,0.18);
    }
    .corner-holo::before{
      content:"";
      position:absolute;
      inset:10px;
      border:1px dashed rgba(125,211,252,0.4);
      border-radius:14px;
    }
    .corner-holo.tl{top:80px;left:2%;}
    .corner-holo.tr{top:80px;right:2%;}
    .corner-holo.bl{bottom:40px;left:2%;}
    .corner-holo.br{bottom:40px;right:2%;}
    /* 侧边悬浮小仪表 */
    .side-hud-vertical{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:110px;
      z-index:1;
      pointer-events:none;
      border:1px solid rgba(125,211,252,0.3);
      border-radius:16px;
      padding:12px 10px;
      background:linear-gradient(180deg,rgba(14,165,233,0.12),rgba(59,130,246,0.06));
      box-shadow:inset 0 0 18px rgba(56,189,248,0.15);
    }
    .side-hud-vertical.left{left:1%;}
    .side-hud-vertical.right{right:1%;}
    .hud-bar{
      height:6px;
      background:rgba(125,211,252,0.15);
      border-radius:3px;
      margin:10px 0;
      overflow:hidden;
      position:relative;
    }
    .hud-bar-fill{
      position:absolute;
      left:0;top:0;bottom:0;
      background:linear-gradient(90deg,#38bdf8,#2563eb);
      border-radius:3px;
      animation:hudFill 6s ease-in-out infinite;
    }
    @keyframes hudFill{
      0%,100%{width:20%;}
      50%{width:85%;}
    }
    /* 边角小型全息标签 */
    .corner-tag{
      position:absolute;
      z-index:1;
      pointer-events:none;
      font-size:11px;
      color:#7dd3fc;
      letter-spacing:1px;
      opacity:0.45;
      border:1px solid rgba(125,211,252,0.25);
      padding:4px 8px;
      border-radius:4px;
      background:rgba(14,165,233,0.08);
    }
    .tag-top-left{top:90px;left:2%;}
    .tag-bottom-right{bottom:40px;right:2%;}
    /* ===== 导航栏：和analysis保持完全一致 ===== */
    .nav-bar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:999;
      background:rgba(226, 242, 255, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding:14px 20px;
      display:flex;
      justify-content:center;
      gap:16px;
      border-bottom:1px solid rgba(125, 211, 252, 0.25);
    }
    .nav-btn{
      padding:10px 28px;
      border:none;
      border-radius:10px;
      font-size:17px;
      cursor:pointer;
      transition:0.24s ease;
    }
    /* 【平台介绍】现在使用原来data‑upload的样式：白底黑字+蓝色描边 */
    .nav-btn.btn-page-current{
      background:#ffffff !important;
      color:#222222 !important;
      border:1px solid rgba(56, 189, 248, 0.45) !important;
      box-shadow:0 4px 14px rgba(41, 128, 185, 0.15) !important;
    }
    .nav-btn.btn-page-current:hover{
      background:#f7fbff !important;
      color:#165DFF !important;
    }
    /* 普通按钮（现在【数据上传】变回原版深蓝色） */
    .nav-btn.normal-blue{
      background:#2980b9;
      color:#ffffff;
    }
    .nav-btn.normal-blue:hover:not(.active){
      background:#1f6d99;
    }
    .nav-btn.active{
      background:#ffffff;
      color:#222222;
      box-shadow:0 2px 6px rgba(0,0,0,0.12);
    }
    /* ===== 主体容器 ===== */
    .container{
      position:relative;
      z-index:3;
      max-width:960px;
      margin:0 auto;
      padding:0 24px;
    }
    .back-box{
      margin-bottom:28px;
    }
    .back-box a{
      color:#7dd3fc;
      text-decoration:none;
      font-size:18px;
    }
    .back-box a:hover{
      text-decoration:underline;
    }
    h2{
      text-align:center;
      font-size:34px;
      color:#e0f2fe;
      text-shadow:0 0 16px rgba(125,211,252,0.6);
      margin-bottom:38px;
    }
    .intro-grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:32px;
    }
    /* 卡片改成深色全息毛玻璃，和整体科幻风格统一，放大模块框 */
    .intro-card{
      background:linear-gradient(135deg, rgba(15, 58, 110, 0.55), rgba(30, 90, 160, 0.45));
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border:1px solid rgba(125, 211, 252, 0.35);
      border-radius:18px;
      box-shadow:0 4px 16px rgba(41,128,185,0.1);
      padding:40px 36px;
      min-height:260px;
      color:#e0f2fe;
      font-size:18px;
      line-height:1.7;
    }
    @media(max-width:992px){
      .outer-ring-scifi{display:none;}
      .radar-dot-field{display:none;}
      .data-flow-lines{display:none;}
      .corner-holo{display:none;}
      .side-hud-vertical{display:none;}
      .corner-tag{display:none;}
      .container{max-width:100%;}
      h2{font-size:30px;}
      .intro-card{padding:32px 28px;font-size:17px;min-height:220px;}
    }
    @media(max-width:768px){
      .page-wrap{padding-top:70px; padding-bottom:20px;}
      .nav-bar{
        gap:8px;
        padding:12px 12px;
      }
      .nav-btn{
        padding:8px 16px;
        font-size:15px;
      }
      .pulse-particles{display:none;}
      .scan-flow-light{display:none;}
      .vertical-scan{display:none;}
      .back-box a{font-size:16px;}
      h2{font-size:26px;}
      .intro-card{padding:24px 20px;font-size:16px;}
      .intro-grid{gap:22px;}
    }
  </style>
</head>
<body>
<div class="page-wrap">
  <div class="grid-overlay"></div>
  <div class="particles"></div>
  <div class="scan-flow-light"></div>
  <div class="vertical-scan"></div>
  <div class="scan-light"></div>
  <div class="pulse-particles" aria-hidden="true">
    <div class="pulse-dot dot1"></div>
    <div class="pulse-dot dot2"></div>
    <div class="pulse-dot dot3"></div>
    <div class="pulse-dot dot4"></div>
  </div>
  <div class="outer-ring-scifi" aria-hidden="true"></div>
  <div class="radar-dot-field" aria-hidden="true"></div>
  <div class="data-flow-lines" aria-hidden="true"></div>
  <div class="corner-holo tl" aria-hidden="true"></div>
  <div class="corner-holo tr" aria-hidden="true"></div>
  <div class="corner-holo bl" aria-hidden="true"></div>
  <div class="corner-holo br" aria-hidden="true"></div>
  <div class="side-hud-vertical left" aria-hidden="true">
    <div class="hud-bar"><div class="hud-bar-fill"></div></div>
    <div class="hud-bar"><div class="hud-bar-fill" style="animation-delay:1.5s;"></div></div>
    <div class="hud-bar"><div class="hud-bar-fill" style="animation-delay:3s;"></div></div>
  </div>
  <div class="side-hud-vertical right" aria-hidden="true">
    <div class="hud-bar"><div class="hud-bar-fill" style="animation-delay:0.5s;"></div></div>
    <div class="hud-bar"><div class="hud-bar-fill" style="animation-delay:2s;"></div></div>
    <div class="hud-bar"><div class="hud-bar-fill" style="animation-delay:3.5s;"></div></div>
  </div>
  <div class="corner-tag tag-top-left">PLATFORM‑INFO</div>
  <div class="corner-tag tag-bottom-right">ANALYSIS‑PIPELINE</div>
  <!-- 按钮顺序【位置完全不变】：平台介绍（现在白底蓝边）｜数据上传（变回深蓝）｜结果展示（深蓝） -->
  <div class="nav-bar">
    <button class="nav-btn btn-page-current" data-target="intro" onclick="location.href='intro.html'">平台介绍</button>
    <button class="nav-btn normal-blue" data-target="analysis" onclick="location.href='analysis.html'">数据上传</button>
    <button class="nav-btn normal-blue" data-target="result" onclick="location.href='result.html'">结果展示</button>
  </div>
  <div class="container">
    <div class="back-box">
      <a href="index.html">← 返回平台首页</a>
    </div>
    <h2>平台介绍</h2>
    <div class="intro-grid">
      <div class="intro-card">
      </div>
      <div class="intro-card">
      </div>
      <div class="intro-card">
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const path = window.location.pathname;
  const btns = document.querySelectorAll(".nav-btn");
  btns.forEach(b=>{
    b.classList.remove("active");
    const t = b.dataset.target;
    if(t==="intro" && path.includes("intro.html")) b.classList.add("active");
    if(t==="analysis" && path.includes("analysis.html")) b.classList.add("active");
    if(t==="result" && path.includes("result.html")) b.classList.add("active");
  })
})()
</script>
</body>
</html>
